<style>
:root{--bg:#071748;--side:#fff;--line:#dbe4f5;--fg:#0b1f67;--mut:#68738a;--acc:#1557bd;--accbg:#edf3fc}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
nav{width:244px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:6px;text-decoration:none;color:var(--fg)}
.brand img{width:64px;height:64px;border-radius:12px;flex:none;object-fit:cover}
.brand b{display:block;font-size:15px;letter-spacing:.06em;color:var(--fg)}.brand small{display:block;color:var(--mut);font-size:11.5px;line-height:1.25}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:10px 8px 4px}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.tab svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{display:flex;flex-direction:column;min-width:0}.tab b{font-size:15px;font-weight:600}.tab small{color:var(--mut);font-size:12px}
.tab:hover{background:#f3f7fd}
.tab[aria-selected=true]{background:var(--accbg);border-color:#9fc0f0;box-shadow:inset 3px 0 0 var(--acc)}.tab[aria-selected=true] svg{stroke:var(--acc)}
.tab:focus-visible,.site:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}.ct{border-top:1px solid var(--line);padding:12px 8px 4px;font-size:12px;color:var(--mut);line-height:1.6}
.ct a{color:#1557bd;text-decoration:none;display:block}.ct a:hover{text-decoration:underline}
main{flex:1;min-width:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.lg{display:flex;align-items:center;gap:8px;margin:2px 6px 4px;flex:none}.lg svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.lg select{flex:1;font:600 13px system-ui,sans-serif;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#snd{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;align-items:center;gap:8px;background:#fff;color:#0b1f67;border:1px solid #9fc0f0;border-radius:999px;padding:9px 16px 9px 12px;font:600 13px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)}#snd:hover{background:#edf3fc}#snd svg{width:18px;height:18px;fill:none;stroke:#1557bd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px));gap:6px}
.brand{border:0;margin:0;padding:0}.brand div,.lbl,.sp,.ct,.tab small{display:none}.lg{margin:0}.lg svg{display:none}.brand img{width:40px;height:40px}.tab{width:auto;flex:none;padding:8px 12px}.tab b{font-size:13px;white-space:nowrap}.tab svg{width:18px;height:18px}}
</style></head><body>

<script>
var U={jaw:'jaw/',hammer:'hammer/',round:'round/',stamp:'stamp/',ball:'ball/',vat:'vat/',cip:'cip/',elution:'elution/',smelt:'smelt/'},cur=null,fr=null;
function show(id){
 if(!U[id])id='jaw';if(cur===id&&fr)return;cur=id;
 document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.id===id)});
 if(fr)fr.remove();
 fr=document.createElement('iframe');fr.title=id;fr.allow='fullscreen; autoplay';fr.setAttribute('allowfullscreen','');fr.src=U[id];
 document.getElementById('stage').appendChild(fr);
 try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){show(t.dataset.id)})});
show((location.hash||'').slice(1)||'jaw');

(function(){var a=document.getElementById('bgm'),b=document.getElementById('snd'),l=b.querySelector('span'),muted=false;
try{muted=localStorage.getItem('sgMuted')==='1'}catch(e){}
a.volume=.4;
function ui(){var on=!a.paused&&!muted;var T=window.SGT||{};l.textContent=on?(T.on||'Music on'):(muted?(T.off||'Music off'):(T.play||'Play music'));b.setAttribute('aria-pressed',on)}
function go(){if(muted)return;a.muted=false;var p=a.play();if(p&&p.catch)p.catch(function(){});setTimeout(ui,150)}
b.addEventListener('click',function(e){e.stopPropagation();if(!a.paused&&!muted){muted=true;a.pause()}else{muted=false;a.play().catch(function(){})}try{localStorage.setItem('sgMuted',muted?'1':'0')}catch(x){}setTimeout(ui,100)});
['pointerdown','keydown','touchstart'].forEach(function(ev){window.addEventListener(ev,function f(){if(!a.paused||muted)return;go()},{passive:true})});
a.addEventListener('play',ui);a.addEventListener('pause',ui);go();ui();
})();
</script><script type="module">
import {LANGS,getLang,setLang,loadDict,makeMap,translateDOM} from './shared/i18n.js';
var sel=document.getElementById('lang'),lang=getLang();sel.value=lang;
var EX={zh:{'Music off':'音乐关','Play music':'播放音乐'},fr:{'Music off':'Musique coupée','Play music':'Lire la musique'},pt:{'Music off':'Música desligada','Play music':'Tocar música'}};
sel.addEventListener('change',function(){setLang(sel.value);location.reload()});
if(lang!=='en'){loadDict(lang).then(function(d){var m=makeMap(d,EX[lang]);document.documentElement.lang=lang;
 window.SGT={on:m.get('Music on'),off:EX[lang]['Music off'],play:EX[lang]['Play music']};
 translateDOM(document.body,m,d);var t=m.get(document.title);if(t)document.title=t;
 var b=document.getElementById('snd');b.title=m.get('Background music')||b.title;
 var l=b.querySelector('span');l.textContent=window.SGT.on;
}).catch(function(e){console.warn('language',e)})}
</script>
