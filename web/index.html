<style>
:root{--bg:#08090c;--side:#0d0f14;--line:#1f2430;--fg:#eef0f4;--mut:#98a0b0;--acc:#ea6607;--accbg:#2a1a0a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
nav{width:244px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:6px;text-decoration:none;color:var(--fg)}
.brand img{width:48px;height:48px;border-radius:6px;flex:none;object-fit:contain}
.brand b{display:block;font-size:12px;letter-spacing:.03em;color:var(--acc);line-height:1.3}.brand small{display:block;color:var(--mut);font-size:11px;line-height:1.25}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:10px 8px 4px}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;font:inherit}
.tab svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{display:flex;flex-direction:column;min-width:0}.tab b{font-size:14px;font-weight:600}.tab small{color:var(--mut);font-size:11.5px}
.tab:hover{background:#151922}
.tab[aria-selected=true]{background:var(--accbg);border-color:#6b3410}.tab[aria-selected=true] svg{stroke:var(--acc)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}.ct{border-top:1px solid var(--line);padding:12px 8px 4px;font-size:11.5px;color:var(--mut);line-height:1.6}
.ct a{color:var(--acc);text-decoration:none;display:block}.ct a:hover{text-decoration:underline}
main{flex:1;min-width:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
video.flythrough{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
video.flythrough.active{display:block}
#music-btn{position:fixed;top:14px;right:14px;z-index:1000;background:#222222cc;color:#fff;border:1px solid #444;border-radius:20px;padding:6px 16px;cursor:pointer;font-size:12px;backdrop-filter:blur(8px)}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px));gap:2px;min-height:52px}
.brand{border:0;margin:0;padding:0;flex:none}.brand div,.lbl,.sp,.ct,.tab small{display:none}.brand img{width:32px;height:32px;border-radius:4px}.tab{width:auto;flex:none;padding:6px 8px;gap:6px;border-radius:8px}.tab b{font-size:11px;white-space:nowrap}.tab svg{width:15px;height:15px}
#music-btn{top:auto;bottom:8px;right:8px;padding:5px 12px;font-size:11px}}
</style></head><body>

<button id="music-btn">Play music</button>
<audio id="bgm" loop></audio>
<script>
var CDN='https://cdn.jsdelivr.net/gh/360Zimbabwe/spartan-gold-3d@a25a4ca521d28c4ecb877a973f190985cffd0803/';
var VIEWERS={jaw:'jaw/',hammer:'hammer/',round:'round/',stamp:'stamp/',ball:'ball/',vat:'vat/',cip:'cip/',elution:'elution/',smelt:'smelt/'};
var FILMS={jaw:'films-mmes/jaw.mp4',hammer:'films-mmes/hammer.mp4',round:'films-mmes/round.mp4',stamp:'films-mmes/stamp.mp4',ball:'films-mmes/ball.mp4',vat:'films-mmes/vat.mp4',cip:'films-mmes/cip.mp4',elution:'films-mmes/elution.mp4',smelt:'films-mmes/smelt.mp4'};
var MUSIC=[CDN+'web/shared/bgm.mp3','shared/bgm.mp3'];
var cur=null,activeEl=null;
var aud=document.getElementById('bgm');
var mbtn=document.getElementById('music-btn');
var stage=document.getElementById('stage');
var muted=false,musicReady=false;

try{muted=localStorage.getItem('mmesMuted')==='1';}catch(e){}

function tryLoadMusic(idx){
  if(idx>=MUSIC.length)return;
  aud.src=MUSIC[idx];
  aud.onerror=function(){tryLoadMusic(idx+1);};
  aud.oncanplaythrough=function(){
    musicReady=true;
    mbtn.textContent=muted?'Music off':'Music on';
    if(!muted)aud.play().catch(function(){});
  };
  aud.load();
}

function startMusic(){
  if(!musicReady)tryLoadMusic(0);
  document.removeEventListener('pointerdown',startMusic);
  document.removeEventListener('keydown',startMusic);
}
document.addEventListener('pointerdown',startMusic);
document.addEventListener('keydown',startMusic);

mbtn.onclick=function(){
  startMusic();
  muted=!muted;
  if(muted){aud.pause();}else{if(musicReady)aud.play().catch(function(){});}
  mbtn.textContent=musicReady?(muted?'Music off':'Music on'):'Play music';
  try{localStorage.setItem('mmesMuted',muted?'1':'0');}catch(e){}
};

function show(id){
  if(cur===id)return;
  cur=id;
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.id===id);});
  // Remove old content
  while(stage.firstChild)stage.removeChild(stage.firstChild);

  if(id.indexOf('fly-')===0){
    // Flythrough film
    var key=id.slice(4);
    var v=document.createElement('video');
    v.className='flythrough active';
    v.controls=true;
    v.autoplay=true;
    v.loop=true;
    v.playsInline=true;
    // Try CDN first, fallback to relative
    var src1=CDN+FILMS[key];
    var src2=FILMS[key];
    var s1=document.createElement('source');s1.src=src1;s1.type='video/mp4';
    var s2=document.createElement('source');s2.src=src2;s2.type='video/mp4';
    v.appendChild(s1);v.appendChild(s2);
    stage.appendChild(v);
    v.play().catch(function(){});
  } else {
    // Interactive 3D viewer
    var fr=document.createElement('iframe');
    fr.title=id;
    fr.allow='fullscreen; autoplay';
    fr.setAttribute('allowfullscreen','');
    fr.src=VIEWERS[id];
    stage.appendChild(fr);
  }
  try{history.replaceState(null,'','#'+id);}catch(e){}
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){show(t.dataset.id);});
});

var init=(location.hash||'').slice(1)||'jaw';
show(init);
</script></body></html>
