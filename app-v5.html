<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030508">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#030508;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#c{display:block;width:100%;height:100%}
#logo-overlay{
  position:fixed;top:max(20px,env(safe-area-inset-top,0px));

}
#logo-name{font-family:'Space Grotesk',sans-serif;font-size:clamp(16px,3vw,26px);font-weight:700;color:#d4a830;letter-spacing:0.04em}
#logo-sub{font-family:'Inter',sans-serif;font-size:clamp(8px,1.2vw,10px);font-weight:400;letter-spacing:0.22em;text-transform:uppercase;color:rgba(200,170,80,0.55);margin-top:3px}
.logo-rule{width:clamp(100px,20vw,200px);height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,48,0.4),transparent);margin:6px auto 0}
#coin-labels{

  pointer-events:none
}
.cl{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
.cl .dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 5px 2px var(--c);background:var(--c);margin-bottom:2px}
.cl .abbr{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--c)}
.cl .full{font-family:'Inter',sans-serif;font-size:8px;font-weight:300;letter-spacing:0.06em;color:rgba(220,220,230,0.5);white-space:nowrap}
#ui{
  position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;gap:5px;z-index:10;flex-wrap:wrap
}
.pp{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:7px 11px;border-radius:20px;border:1px solid rgba(212,168,48,0.2);background:rgba(3,5,8,0.6);color:rgba(180,160,100,0.45);cursor:pointer;transition:all 0.35s ease;pointer-events:auto}
.pp.active{border-color:rgba(212,168,48,0.7);color:#f0d060;background:rgba(212,168,48,0.1)}
/* step annotation: blue digital typewriter box under the logo */
#step-box{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);
  left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));

  opacity:0;transition:opacity .4s ease;overflow:hidden;
}
#step-box.on{opacity:1}
#step-box::before{content:'';position:absolute;inset:0;pointer-events:none;

#step-box::after{content:'';position:absolute;right:0;top:0;width:14px;height:14px;
  border-top:2px solid #3aa0ff;border-right:2px solid #3aa0ff}
#sb-head{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9ad8ff;
  text-shadow:0 0 8px rgba(90,190,255,.9);margin-bottom:5px;min-height:15px}
#sb-text{font-size:11.5px;line-height:1.5;color:#4db8ff;text-shadow:0 0 6px rgba(60,160,255,.75);letter-spacing:.02em}
.sb-cur{display:inline-block;width:.55em;height:1em;margin-left:2px;vertical-align:-0.12em;background:#7fd0ff;

#loading.fade{opacity:0;pointer-events:none}
#loading.go{opacity:0;pointer-events:none;transition:opacity 3.4s cubic-bezier(.4,0,.2,1)}
#ll{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#d4a830;letter-spacing:0.04em;margin-bottom:6px}
#ls{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(180,160,80,0.5);margin-bottom:28px}

/* ── Detail panel ────────────────────────────────────────── */
#detail{

  display:flex;flex-direction:column;
  overflow:hidden;
}

#detail-panel{
  flex:1;
  margin:0 max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px));
  border-radius:20px 20px 16px 16px;

  position:relative;z-index:2;
}
#panel-coin-thumb{
  width:52px;height:52px;border-radius:50%;

  overflow:visible;
}
#panel-coin-thumb canvas{width:52px;height:52px;border-radius:50%;display:block}
/* rotating lens flare ring */
#flare-ring{
  position:absolute;
  inset:-8px;
  border-radius:50%;
  animation:flareRotate 2s linear infinite;
  pointer-events:none;
}
@keyframes flareRotate{to{transform:rotate(360deg)}}
#panel-titles{flex:1}
#panel-ticker{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--panel-color,#38d980);text-shadow:0 0 16px var(--panel-glow,rgba(40,180,80,0.8))}
#panel-name{font-family:'Inter',sans-serif;font-size:12px;font-weight:300;color:rgba(200,220,240,0.7);letter-spacing:0.05em;margin-top:2px}
#close-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.2s ease;
}
#close-btn:hover{background:rgba(255,255,255,0.1);color:#fff}

#panel-scroll{
  flex:1;overflow:hidden;padding:16px 20px 24px;
  position:relative;z-index:2;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;
}
#panel-scroll::-webkit-scrollbar{width:3px}
#panel-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px}
#credits-inner{
  display:flex;flex-direction:column;
}
#credits-inner{will-change:transform}
#credits-inner.rising{
  animation:creditsRise var(--dur,40s) linear infinite;
}
@keyframes creditsRise{
  from{transform:translateY(var(--start,420px))}
  to{transform:translateY(-100%)}
}
.msg-line.scrambling{color:var(--panel-color,#38d980)!important;opacity:1!important;text-shadow:0 0 8px var(--panel-color,#38d980)}

/* scrolling text lines */
.msg-line{
  font-family:'Inter',sans-serif;font-size:13px;line-height:1.75;
  color:rgba(200,220,240,0);
  opacity:0;
  transform:translateY(16px);
  transition:all 0.6s ease;
  margin-bottom:2px;
}
.msg-line.show{color:rgba(200,220,240,0.88);opacity:1;transform:translateY(0)}
.msg-line.heading{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0);margin-top:14px;margin-bottom:4px}
.msg-line.heading.show{color:var(--panel-color,#38d980)}
.msg-line.stat{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:rgba(255,255,255,0);margin-bottom:0px}
.msg-line.stat.show{color:#fff}
.msg-line.sub{font-size:11px;color:rgba(200,220,240,0)}
.msg-line.sub.show{color:rgba(200,220,240,0.5)}
.divider-line{height:1px;background:linear-gradient(90deg,transparent,var(--panel-color,#38d980),transparent);opacity:0;margin:14px 0;transition:opacity 0.6s ease}
.divider-line.show{opacity:0.3}
/* glowing tag pills */
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;opacity:0;transition:opacity 0.6s ease}
.tag-row.show{opacity:1}
.tag{font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid var(--panel-color,#38d980);color:var(--panel-color,#38d980);background:rgba(0,0,0,0.3)}
/* ── Intro / dissolve ───────────────────────────────────── */
#tap{margin-top:-8px;display:none;flex-direction:column;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:.38em;color:#f0d060;text-shadow:0 0 12px rgba(240,200,60,.7);animation:tapPulse 2.2s ease-in-out infinite}
#tap span{font-family:'Inter',sans-serif;font-size:9px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:rgba(200,170,80,.55);text-shadow:none}
@keyframes tapPulse{50%{opacity:.35}}
#loading{cursor:pointer}
.dis{opacity:0;filter:blur(12px);transform:translateY(12px) scale(.9);transition:opacity 1.5s ease,filter 1.5s ease,transform 1.5s cubic-bezier(.2,.8,.2,1)!important;pointer-events:none!important}
.dis.in{opacity:1;filter:none;transform:none}
#logo-overlay.dis,#coin-labels.dis{transform:translateY(8px) scale(.96)}
#logo-overlay.dis.in,#coin-labels.dis.in{transform:none}
/* ── Top tabs ───────────────────────────────────────────── */
#tabs{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 70px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tab:first-child{margin-left:auto}.tab:last-child{margin-right:auto}
#tabs::-webkit-scrollbar{display:none}
#tabs.dis.in{pointer-events:auto!important}
.tab{flex:0 0 auto;font-family:'Space Grotesk',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:6px;
  border:1px solid rgba(56,217,128,.28);background:rgba(3,10,8,.62);color:rgba(150,230,190,.75);cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .3s ease;white-space:nowrap}
.tab:hover{border-color:rgba(56,217,128,.7);color:#bff5d9}
.tab.active{background:rgba(56,217,128,.16);border-color:#38d980;color:#e6fff2;box-shadow:0 0 14px rgba(56,217,128,.35)}
#mute{position:fixed;z-index:62;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(12px,env(safe-area-inset-right,0px));width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(212,168,48,.35);background:rgba(3,5,8,.6);color:#f0d060;font-size:14px;line-height:1;cursor:pointer;padding:0}
#mute.in{pointer-events:auto!important}
#mute.off{color:rgba(200,170,80,.35);text-decoration:line-through}
/* ── Explainer overlay ──────────────────────────────────── */
#xp{position:fixed;inset:0;z-index:45;background:rgba(2,5,7,.94);opacity:0;pointer-events:none;transition:opacity .6s ease;display:flex;flex-direction:column}
#xp.open{opacity:1;pointer-events:auto}
#xp::before,#xp::after{content:'';position:absolute;left:0;right:0;pointer-events:none;z-index:2}
#xp::before{top:0;height:calc(env(safe-area-inset-top,0px) + 132px);background:linear-gradient(#020507 62%,rgba(2,5,7,0))}
#xp::after{bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 84px);background:linear-gradient(rgba(2,5,7,0),#020507 55%)}
#xp-back{z-index:3}
#xp-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 168px) max(16px,env(safe-area-inset-left,0px)) 90px;scrollbar-width:thin;scrollbar-color:rgba(56,217,128,.25) transparent;-webkit-overflow-scrolling:touch}
#xp-body{max-width:560px;margin:0 auto;font-family:'Inter',sans-serif;color:rgba(214,232,224,.9)}
#xp-back{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 22px;border-radius:24px;border:1px solid rgba(240,200,60,.6);background:rgba(8,12,10,.9);color:#f0d060;cursor:pointer;box-shadow:0 0 20px rgba(212,168,48,.2)}
.xe{opacity:0;filter:blur(10px);transform:translateY(16px) scale(.96);transition:opacity .9s ease,filter .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.xe.in{opacity:1;filter:none;transform:none}
.xg>.xe:nth-child(odd){transform:translate(-22px,18px) scale(.95)}
.xg>.xe:nth-child(even){transform:translate(22px,18px) scale(.95)}
.xg>.xe.in{transform:none}
.xk{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#38d980;margin-bottom:6px}
.xt{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;line-height:1.12;color:#fff;margin-bottom:10px;text-wrap:balance}
.xl{font-size:14px;line-height:1.6;color:rgba(214,232,224,.82);margin-bottom:18px}
.xh{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#d4a830;margin:26px 0 10px}
.xg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.xg.g3{grid-template-columns:repeat(3,1fr)}
.xg.g1{grid-template-columns:1fr}
.xc{border:1px solid rgba(56,217,128,.2);background:linear-gradient(160deg,rgba(14,40,28,.55),rgba(5,12,10,.55));border-radius:10px;padding:11px 12px;min-width:0}
.xc b{display:block;font-family:'Space Grotesk',sans-serif;font-size:13px;color:#eafff4;margin-bottom:3px}
.xc p,.xc span.s{font-size:12px;line-height:1.5;color:rgba(200,222,212,.78)}
.xc .n{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:#04110a;background:#38d980;margin-bottom:6px}
.xc img{display:block;width:100%;max-height:96px;object-fit:cover;border-radius:6px;margin-bottom:8px}
.xc .tg{display:inline-block;margin-top:6px;font-family:'Space Grotesk',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:12px;border:1px solid rgba(212,168,48,.5);color:#f0d060}
.xs{text-align:center;padding:12px 6px}
.xs strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;color:#f0d060;text-shadow:0 0 14px rgba(240,200,60,.4);line-height:1.1}
.xs span{font-size:10.5px;line-height:1.35;color:rgba(200,222,212,.75);display:block;margin-top:4px}
.xeq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#fff;padding:14px 8px}
.xeq i{font-style:normal;color:#38d980;font-size:20px}
.xeq em{font-style:normal;padding:7px 12px;border-radius:8px;border:1px solid rgba(56,217,128,.45);background:rgba(56,217,128,.08)}
.xq{border-left:2px solid #d4a830;background:rgba(212,168,48,.07);border-radius:0 10px 10px 0;padding:11px 13px;font-size:12.5px;line-height:1.6;color:rgba(232,226,200,.9)}
.xq b{font-family:'Space Grotesk',sans-serif;color:#f0d060}
.xj{display:flex;flex-direction:column;gap:9px}
.xj .xc{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.xj .xc .n{margin:0}
.xj .lk{display:inline-block;margin-left:6px;font-family:'Space Grotesk',sans-serif;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding:1px 7px;border-radius:10px;background:rgba(212,168,48,.18);border:1px solid rgba(212,168,48,.55);color:#f0d060;vertical-align:1px}
.xcurve{width:100%;height:auto;display:block}
.xcurve path.cv{stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset 2.4s ease .4s}
.xe.in .xcurve path.cv{stroke-dashoffset:0}
.xfoot{font-size:10.5px;line-height:1.55;color:rgba(170,190,182,.55);margin-top:26px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
@media (max-width:420px){.xg.g3{grid-template-columns:1fr 1fr 1fr}.xs strong{font-size:18px}.xt{font-size:23px}}
/* ══ SIGNATURE FINISH: neon-edge UI, beat-reactive glow, starfield, tap shockwaves ══ */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinA{to{--a:360deg}}
@keyframes ignite{0%{box-shadow:0 0 0 0 var(--gl)}25%{box-shadow:0 0 34px 8px var(--gl),0 0 70px 14px var(--gl)}100%{box-shadow:0 0 calc(6px + var(--bass,0)*16px) 0 var(--gl)}}
.tab,.pp{position:relative;--gl:rgba(56,217,128,.5);box-shadow:0 0 calc(6px + var(--bass,0)*16px) 0 var(--gl)}
.pp{--gl:rgba(240,200,60,.4)}
.tab::before,.pp::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 52%,var(--ec,#38d980) 76%,#fff 90%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:spinA 3.4s linear infinite;opacity:calc(.55 + var(--bass,0)*.45)}
.pp{--ec:#f0d060}
.tab:nth-child(even)::before,.pp:nth-child(even)::before{animation-duration:4.6s;animation-direction:reverse}
.ign{animation:ignite 2s ease-out both}
.tab.active,.pp.active{box-shadow:0 0 calc(14px + var(--bass,0)*20px) 2px var(--gl)}
#logo-name{background:linear-gradient(100deg,#a87a22 20%,#fff2b0 38%,#d4a830 48%,#a87a22 70%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5.5s linear infinite;
  filter:drop-shadow(0 0 calc(4px + var(--bass,0)*10px) rgba(240,200,60,.55))}
@keyframes shim{to{background-position:-260% 0}}
.xt{background:linear-gradient(100deg,#fff 30%,#9bffd0 46%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
@keyframes cardFlash{0%{box-shadow:0 0 0 0 rgba(56,217,128,0);border-color:rgba(56,217,128,.2)}30%{box-shadow:0 0 26px 2px rgba(56,217,128,.55),inset 0 0 18px rgba(56,217,128,.18);border-color:#38d980}100%{box-shadow:0 0 0 0 rgba(56,217,128,0);border-color:rgba(56,217,128,.2)}}
.xc.xe.in{animation:cardFlash 1.9s ease-out .15s both}

{

// ── Coin face texture ──────────────────────────────────────────────
function buildCoinTexture(opts){
  const cv=document.createElement('canvas');cv.width=cv.height=512;
  const c=cv.getContext('2d');
  const cx=256,cy=256,R=240;
  const bg=c.createRadialGradient(cx-40,cy-60,10,cx,cy,R);
  bg.addColorStop(0,opts.hilight);bg.addColorStop(0.35,opts.mid);
  bg.addColorStop(0.7,opts.base);bg.addColorStop(1,opts.shadow);
  c.beginPath();c.arc(cx,cy,R,0,TAU);c.fillStyle=bg;c.fill();
  c.beginPath();c.arc(cx,cy,R-4,0,TAU);c.strokeStyle=opts.hilight;c.lineWidth=7;c.globalAlpha=0.6;c.stroke();
  c.beginPath();c.arc(cx,cy,R-12,0,TAU);c.strokeStyle=opts.shadow;c.lineWidth=4;c.globalAlpha=0.4;c.stroke();
  c.globalAlpha=1;
  c.beginPath();c.arc(cx,cy,R*0.78,0,TAU);
  const ig=c.createRadialGradient(cx-20,cy-30,5,cx,cy,R*0.78);
  ig.addColorStop(0,opts.innerHi);ig.addColorStop(0.5,opts.innerMid);ig.addColorStop(1,opts.innerDark);
  c.fillStyle=ig;c.fill();
  c.beginPath();c.arc(cx,cy,R*0.78,0,TAU);c.strokeStyle=opts.hilight;c.lineWidth=3;c.globalAlpha=0.5;c.stroke();
  c.globalAlpha=1;
  for(let i=0;i<96;i++){
    const a=i/96*TAU,r0=R-4,r1=R-14;
    c.beginPath();c.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);c.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    c.strokeStyle=i%2===0?opts.hilight:opts.shadow;c.lineWidth=1.5;c.globalAlpha=0.35;c.stroke();
  }
  c.globalAlpha=1;
  c.save();c.beginPath();c.arc(cx,cy,R*0.78,0,TAU);c.clip();
  for(let i=0;i<36;i++){
    const a=i/36*TAU;
    c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*R*0.78,cy+Math.sin(a)*R*0.78);
    c.strokeStyle=opts.hilight;c.lineWidth=0.5;c.globalAlpha=0.07;c.stroke();
  }
  c.restore();c.globalAlpha=1;
  const iconR=R*0.42;
  const idb=c.createRadialGradient(cx,cy,0,cx,cy,iconR);
  idb.addColorStop(0,opts.iconBgHi);idb.addColorStop(1,opts.iconBgDark);
  c.beginPath();c.arc(cx,cy,iconR,0,TAU);c.fillStyle=idb;c.fill();
  c.beginPath();c.arc(cx,cy,iconR,0,TAU);c.strokeStyle=opts.iconRing;c.lineWidth=3;c.globalAlpha=0.7;c.stroke();

  c.fillStyle=opts.iconColor;c.shadowColor='rgba(0,0,0,0.6)';c.shadowBlur=8;c.shadowOffsetY=3;
  c.fillText(opts.icon,cx,cy-8);c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;
  // pulsing ticker glow (multi-pass)
  const ty=cy+R*0.72;
  c.font='bold 38px "Space Grotesk",sans-serif';c.textAlign='center';c.textBaseline='alphabetic';
  for(let pass=0;pass<4;pass++){
    const blurs=[40,24,14,0];const alphas=[0.5,0.7,0.85,1.0];
    c.shadowColor=opts.tickerColor;c.shadowBlur=blurs[pass];c.globalAlpha=alphas[pass];

  }

  c.fillText(opts.name,cx,ty+30);c.shadowColor='transparent';c.shadowBlur=0;c.globalAlpha=1;
  return new THREE.CanvasTexture(cv);
}

function makeCoin(opts){
  // outer group = what the animation moves/rotates; inner group g is pre-tipped so the
  // coin face (+Y in cylinder space) points along +Z, i.e. straight at the camera.
  const outer=new THREE.Group();
  const g=new THREE.Group();g.rotation.x=PI/2;outer.add(g);
  const R=1.4,T=0.22,SEGS=96;
  const geo=new THREE.CylinderGeometry(R,R,T,SEGS,1,false);
  const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(opts.bodyColor),roughness:0.12,metalness:0.97,envMapIntensity:3.5});
  const body=new THREE.Mesh(geo,mat);body.castShadow=true;body.receiveShadow=true;g.add(body);
  const rimMat=new THREE.MeshStandardMaterial({color:new THREE.Color(opts.rimColor),roughness:0.06,metalness:0.99,envMapIntensity:4});
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(R+0.012,R+0.012,T*0.85,SEGS),rimMat));
  const faceTex=buildCoinTexture(opts);
  const faceMat=new THREE.MeshStandardMaterial({map:faceTex,roughness:0.14,metalness:0.6,envMapIntensity:1.5});
  const faceTop=new THREE.Mesh(new THREE.CircleGeometry(R*0.998,SEGS),faceMat);
  faceTop.rotation.x=-PI/2;faceTop.position.y=T/2+0.001;faceTop.castShadow=true;g.add(faceTop);
  const faceBot=faceTop.clone();faceBot.rotation.x=PI/2;faceBot.position.y=-T/2-0.001;g.add(faceBot);
  const hlMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.07,depthWrite:false});
  const hl=new THREE.Mesh(new THREE.PlaneGeometry(R*0.9,R*0.4),hlMat);
  hl.rotation.x=-PI/2;hl.position.set(-R*0.2,T/2+0.002,-R*0.1);g.add(hl);
  return outer;
}

const xp=$('xp'),xpBody=$('xp-body'),xpScroll=$('xp-scroll'),tabEls=[...document.querySelectorAll('.tab')];

function xResetIdle(){clearTimeout(xIdle);}
let xAuto=0,xHold=0,xEndAt=0,xRaf=0,xLast=0;
function buildX(i){
  if(xIO)xIO.disconnect();
  const tmp=document.createElement('div');tmp.innerHTML=XPAGES[i].join('');
  const targets=[];
  [...tmp.children].forEach(n=>{
    if(n.classList.contains('xg')||n.classList.contains('xj')){[...n.children].forEach(c=>targets.push(c));}
    else targets.push(n);
  });
  targets.forEach(t=>t.classList.add('xe'));
  xpBody.innerHTML='';while(tmp.firstChild)xpBody.appendChild(tmp.firstChild);
  xpScroll.scrollTop=0;xAuto=0;xEndAt=0;xHold=performance.now()+4800;   // let the heading sit clear of the tabs before the text starts to rise
  const sc=$('xp-scan');sc.classList.remove('go');void sc.offsetWidth;sc.classList.add('go');
  let batch=0,bt=0;
  xIO=new IntersectionObserver(es=>{
    es.sort((p,q)=>p.boundingClientRect.top-q.boundingClientRect.top||p.boundingClientRect.left-q.boundingClientRect.left).forEach(en=>{
      if(en.isIntersecting&&!en.target.classList.contains('in')){
        const now=performance.now();if(now-bt>350)batch=0;bt=now;
        en.target.style.transitionDelay=(batch++*0.22)+'s';en.target.classList.add('in');xIO.unobserve(en.target);}});
  },{root:xpScroll,threshold:0.1,rootMargin:'0px 0px -10% 0px'});
  requestAnimationFrame(()=>targets.forEach(e=>xIO.observe(e)));
}
// slow, continuous film-credits style rise while the page is open; touching pauses it for a few seconds
function xTick(ts){
  xRaf=requestAnimationFrame(xTick);
  const dt=Math.min(0.06,(ts-xLast)/1000||0.016);xLast=ts;
  if(xOpen<0)return;
  if(performance.now()<xHold)return;
  const max=xpScroll.scrollHeight-xpScroll.clientHeight;
  if(xpScroll.scrollTop>=max-2){
    if(!xEndAt){xEndAt=performance.now();xpBody.querySelectorAll('.xe:not(.in)').forEach(e=>{e.style.transitionDelay='0s';e.classList.add('in');});}
    return;   // stay at the end: the reader taps BACK TO COINS themselves
  }
  xEndAt=0;xAuto=Math.max(xAuto,xpScroll.scrollTop)+30*dt;xpScroll.scrollTop=xAuto;
}

function xTouched(){xHold=performance.now()+5000;xAuto=xpScroll.scrollTop;xEndAt=0;xResetIdle();}

function dissolve(el,delay){

  },delay);

function enterSfx(){
  const a=getAudio();if(!a||!sfxBus)return;
  const T=a.currentTime+0.01,len=Math.floor(a.sampleRate*0.7),nb=a.createBuffer(1,len,a.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=nb;f.type='bandpass';f.Q.value=1.1;
  f.frequency.setValueAtTime(350,T);f.frequency.exponentialRampToValueAtTime(6500,T+0.42);
  g.gain.setValueAtTime(0.0001,T);g.gain.exponentialRampToValueAtTime(0.5,T+0.3);g.gain.exponentialRampToValueAtTime(0.0001,T+0.7);
  n.connect(f);f.connect(g);g.connect(sfxBus);n.start(T);
  const o=a.createOscillator(),og=a.createGain();o.frequency.setValueAtTime(110,T+0.4);o.frequency.exponentialRampToValueAtTime(38,T+0.9);
  og.gain.setValueAtTime(0.0001,T+0.4);og.gain.exponentialRampToValueAtTime(0.5,T+0.42);og.gain.exponentialRampToValueAtTime(0.0001,T+1.0);
  o.connect(og);og.connect(sfxBus);o.start(T+0.4);o.stop(T+1.05);
}

}

const FLY=[[0,-.75,-.5,.3,-80,-35],[.58,.32,.28,1.6,35,14],[1.3,-.4,.34,.7,-45,-10],[2.0,.38,-.34,1.8,60,18],[2.55,-.18,-.14,1.25,-25,-6],[2.96,0,0,1,0,0]];
const FEND=2.96,FALL=3.5;let fT0=0,flyDone=false;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyAt(t){
  let i=0;while(i<FLY.length-2&&t>=FLY[i+1][0])i++;
  const a=FLY[i],b=FLY[i+1],u=eio(Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))));
  const L=k=>a[k]+(b[k]-a[k])*u;
  return [L(1),L(2),L(3),L(4),L(5)];
}
function flyFrame(now){
  if(flyDone||entered)return;
  const t=(now-fT0)/1000;
  if(t>=FALL){stageEl.style.transform='';stageEl.style.filter='';flyDone=true;stingDone();fI0=now;requestAnimationFrame(idleFrame);return;}
  let x,y,sc,ry,rz,blur=0;
  if(t<FEND){
    [x,y,sc,ry,rz]=flyAt(t);
    const [x2,y2]=flyAt(Math.min(FEND,t+.04));
    blur=Math.min(14,Math.hypot((x2-x)*innerWidth,(y2-y)*innerHeight)*.09);
  }else{
    const k=t-FEND,d=Math.exp(-k*7),w=Math.sin(k*70);   // landing shake
    x=.012*w*d;y=-.016*Math.sin(k*83)*d;sc=1+.035*Math.sin(k*52)*d;ry=0;rz=1.2*Math.sin(k*61)*d;
  }
  stageEl.style.transform='translate('+(x*innerWidth).toFixed(1)+'px,'+(y*innerHeight).toFixed(1)+'px) scale('+sc.toFixed(3)+') rotateY('+ry.toFixed(1)+'deg) rotateZ('+rz.toFixed(1)+'deg)';
  stageEl.style.filter=blur>.4?'blur('+blur.toFixed(1)+'px) brightness('+(1+blur*.05).toFixed(2)+')':'';
  requestAnimationFrame(flyFrame);
}
stageEl.style.transform='translate(-110vw,-90vh) scale(.25)';
let fI0=0;
function idleFrame(now){      // keeps the 3D feel while waiting for the tap
  if(entered)return;
  const k=(now-fI0)/1000;
  stageEl.style.transform='rotateX('+(3.2*Math.cos(k*.8)).toFixed(2)+'deg) rotateY('+(8*Math.sin(k*.9)).toFixed(2)+'deg) scale('+(1+.012*Math.sin(k*1.3)).toFixed(4)+')';
  requestAnimationFrame(idleFrame);
}
